{% extends "base.html" %}
{% block content %}
<h4>Courses</h4>
<form method="post" class="row g-2 my-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-md-2"><input class="form-control" name="code" placeholder="Code (CS101)" required></div>
  <div class="col-md-5"><input class="form-control" name="name" placeholder="Course name" required></div>
  <div class="col-md-2"><input class="form-control" type="number" name="credits" value="3" min="1" max="10"></div>
  <div class="col-md-3"><button class="btn btn-primary w-100">Add course</button></div>
</form>
<table class="table table-hover">
  <thead><tr><th>Code</th><th>Name</th><th>Credits</th><th></th></tr></thead>
  <tbody>
  {% for c in courses %}
    <tr>
      <td>{{ c.code }}</td>
      <td><a href="{{ url_for('main.course_detail', course_id=c.id) }}">{{ c.name }}</a></td>
      <td>{{ c.credits }}</td>
      <td class="text-end">
        <form method="post" action="{{ url_for('main.delete_course', course_id=c.id) }}" onsubmit="return confirm('Delete this course and its grades?')">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-sm btn-outline-danger">Delete</button>
        </form>
      </td>
    </tr>
  {% else %}<tr><td colspan="4" class="text-muted">No courses yet.</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
