{% extends "base.html" %}
{% block title %}Register - StudyHub{% endblock %}
{% block content %}
<div class="text-center mb-3"><h2 class="fw-bold" style="color:var(--brand)"><i class="bi bi-mortarboard-fill"></i> StudyHub</h2><p class="text-muted">Your all-in-one study companion</p></div>
<div class="row justify-content-center"><div class="col-12">
  <div class="card shadow-sm"><div class="card-body">
    <h4 class="mb-3">Create account</h4>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input class="form-control mb-2" name="name" placeholder="Full name" required>
      <input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
      <input class="form-control mb-3" type="password" name="password" placeholder="Password (min 6)" required>
      <button class="btn btn-primary w-100">Register</button>
    </form>
    <p class="mt-3 mb-0 text-center">Have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
  </div></div>
</div></div>
{% endblock %}
